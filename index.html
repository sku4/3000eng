<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Trainer — Minimal Dictionary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { background: #f6f7f9; }
    .word-card {
      max-width: 820px;
      width: 100%;
    }
    .word-main {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      word-break: break-word;
    }
    .word-tran {
      font-size: 1.5rem;
      color: #6c757d;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .word-hidden {
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      font-weight: 600;
      word-break: break-word;
    }
    .block-panel {
      max-width: 720px;
      width: 100%;
    }
    .block-list {
      font-size: .92rem;
      line-height: 1.5;
      column-count: 2;
      column-gap: 1.5rem;
    }
    @media (max-width: 575.98px) {
      .block-list { column-count: 1; }
    }
    .block-list .w {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      break-inside: avoid;
    }
    .block-list .w .ru {
      flex: 0 0 52%;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .block-list .w .en {
      flex: 1 1 auto;
      text-align: start;
    }
    .block-list .is-main { font-weight: 700; }
    .block-list .cur {
      background: #fff3cd;
      border-radius: .25rem;
      margin-left: -.45rem;
    }
    .block-list .cur .ru {
      padding-left: .45rem;
      flex: 0 0 53%;
    }
    .breadcrumb-mini { font-size: .8rem; margin: 0; text-align: start; }
    .breadcrumb-mini .crumb-line { display: block; line-height: 1.5; }
    .breadcrumb-mini .crumb-item { display: inline-block; }
    .breadcrumb-mini .bi-folder2-open { margin-right: .35rem; }
    .breadcrumb-mini .crumb-sub { font-weight: 400; font-size: .92rem; }
    .breadcrumb-mini .crumb-sep { margin: 0 .75rem; }
    .breadcrumb-mini .dot-sep { margin: 0 .4em; }
    #promptLabel .dot-sep { margin: 0 .4em; }
    #promptLabel .crumb-sep { margin: 0 .5rem; }
    @media (max-width: 575.98px) {
      #promptLabel .prompt-sub { display: block; }
    }
    .block-list { text-align: start; }
    .topbar {
      position: sticky; top: 0; z-index: 1020;
      background: #fff;
      border-bottom: 1px solid #e9ecef;
    }
    .stage {
      min-height: calc(100vh - 56px);
    }
    .arrow-sm { font-size: .8em; vertical-align: .03em; }
    #nextBtn:hover, #nextBtn:active, #nextBtn:focus, #nextBtn:focus-visible {
      background-color: transparent;
      color: var(--bs-primary, #0d6efd);
      border-color: var(--bs-primary, #0d6efd);
      box-shadow: none;
    }
    @media (max-width: 575.98px) {
      .topbar .burger-btn { right: .5rem !important; }
      .topbar .search-btn { left: .5rem !important; }
    }

    /* --- Поиск --- */
    .topbar .search-btn { left: 1rem; }
    .topbar .search-btn,
    .topbar .burger-btn { border-color: #dadfe4; }
    .topbar .search-btn:hover,
    .topbar .search-btn:focus,
    .topbar .search-btn:active,
    .topbar .search-btn:focus-visible {
      background-color: transparent;
      color: var(--bs-secondary-color, #6c757d);
      border-color: #dadfe4;
      box-shadow: none;
    }
    .topbar .burger-btn { right: 1rem; }
    #dirTabs { transition: opacity .2s ease; }
    .topbar.search-open #dirTabs { opacity: 0; pointer-events: none; }

    .search-bar {
      position: absolute;
      left: 50%; top: 50%;
      transform: translate(-50%, -50%);
      display: flex; align-items: center; gap: .35rem;
      width: 0; opacity: 0; overflow: visible;
      pointer-events: none;
      background: #fff;
      border: 1px solid #dee2e6;
      border-radius: .375rem;
      padding: .25rem .75rem;
      transition: width .25s ease, opacity .2s ease, padding .25s ease;
      max-width: calc(100% - 8rem);
    }
    .topbar.search-open .search-bar {
      width: min(460px, calc(100% - 8rem));
      opacity: 1;
      pointer-events: auto;
    }
    .search-bar-icon { color: #6c757d; flex: 0 0 auto; }
    #searchInput {
      border: 0; box-shadow: none; outline: none; padding: 0;
      background: transparent; flex: 1 1 auto; min-width: 0;
      font-size: .95rem;
      -webkit-appearance: none; appearance: none;
    }
    #searchInput::-webkit-search-cancel-button,
    #searchInput::-webkit-search-decoration { -webkit-appearance: none; }
    .search-clear {
      flex: 0 0 auto; border: 0; padding: 0; line-height: 1;
      color: #6c757d; background: transparent;
    }
    .search-clear:hover { color: #000; }

    .search-results {
      position: absolute;
      top: calc(100% + .375rem);
      left: 0; right: 0;
      margin: 0; padding: .25rem;
      list-style: none;
      background: #fff;
      border: 1px solid #e9ecef;
      border-radius: .5rem;
      box-shadow: 0 .5rem 1rem rgba(0,0,0,.12);
      z-index: 1030;
      max-height: 70vh;
      overflow-y: auto;
      display: none;
    }
    .search-results.open { display: block; }
    .search-empty { text-align: center; color: #6c757d; padding: .75rem .5rem; font-size: .9rem; }
    .search-item { padding: .4rem .15rem; border-radius: .35rem; cursor: pointer; }
    .search-item:hover, .search-item.active { background: #f1f3f5; }
    .search-crumb { font-size: .72rem; color: #6c757d; line-height: 1.3; margin-bottom: .15rem; }
    .search-crumb .crumb-sep { margin: 0 .5rem; color: #adb5bd; }
    .search-words { font-size: .95rem; line-height: 1.3; }
    .search-words .word { font-weight: 600; }
    .search-words strong { font-weight: 700; color: #0d6efd; }
  </style>
</head>
<body>

<!-- Верхняя панель: бургер (настройки, справа) + поиск (слева) + табы направления (по центру) -->
<header class="topbar" id="topbar">
  <div class="container position-relative d-flex justify-content-center align-items-center gap-3 py-2">
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 position-absolute start-0 search-btn" id="searchBtn" type="button" aria-label="Search">
      <i class="bi bi-search fs-5"></i>
    </button>

    <ul class="nav nav-pills" id="dirTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-en-ru" type="button" data-dir="en-ru">EN <i class="bi bi-arrow-right arrow-sm"></i> RU</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-ru-en" type="button" data-dir="ru-en">RU <i class="bi bi-arrow-right arrow-sm"></i> EN</button>
      </li>
    </ul>

    <div class="search-bar" id="searchBar">
      <input type="search" id="searchInput" placeholder="Search words…" autocomplete="off" spellcheck="false" aria-label="Search words">
      <button class="search-clear" id="searchClear" type="button" aria-label="Clear"><i class="bi bi-x-lg"></i></button>
      <ul class="search-results" id="searchResults" role="listbox"></ul>
    </div>

    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 position-absolute end-0 burger-btn" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#settingsDrawer" aria-controls="settingsDrawer">
      <i class="bi bi-list fs-5"></i>
      <span class="d-none d-sm-inline">Settings</span>
    </button>
  </div>
</header>

<main class="stage d-flex flex-column align-items-center justify-content-start px-3 pt-4 pb-4 gap-4">

  <!-- Карточка со словом -->
  <section class="word-card card shadow-sm border-0 rounded-4 text-center">
    <div class="card-body py-5 px-4 d-flex flex-column align-items-center justify-content-center gap-4">

      <div class="text-secondary small" id="promptLabel">English</div>

      <div class="word-main" id="wordMain">—</div>

      <div class="d-flex flex-wrap gap-2 justify-content-center mt-2" id="btnRow">
        <button class="btn btn-primary" id="revealBtn">
          <i class="bi bi-eye"></i>&nbsp;Show translation
        </button>
        <button class="btn btn-outline-primary" id="nextBtn">
          <i class="bi bi-shuffle"></i>&nbsp;Next word
        </button>
      </div>

      <div class="word-tran d-none" id="wordTran"></div>
      <div class="word-hidden d-none" id="wordHidden"></div>
    </div>
  </section>

  <!-- Блок: тема / раздел / подраздел + все слова блока -->
  <section class="block-panel card shadow-sm border-0 rounded-4 text-start" id="blockPanel">
    <div class="card-body p-3">
      <nav class="breadcrumb-mini text-muted" id="blockCrumbs"></nav>
      <hr class="my-2">
      <div class="block-list text-body-secondary" id="blockList"></div>
    </div>
  </section>
</main>

<!-- Боковое меню настроек -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="settingsDrawer" aria-labelledby="settingsLabel">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="settingsLabel">Settings</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">

    <div class="mb-3">
      <label for="secFrom" class="form-label fw-semibold">Subsection from</label>
      <select class="form-select" id="secFrom"></select>
    </div>

    <div class="mb-3">
      <label for="secTo" class="form-label fw-semibold">Subsection to</label>
      <select class="form-select" id="secTo"></select>
      <div class="form-text">Range includes the selected subsections.</div>
    </div>

    <hr>

    <button class="btn btn-outline-secondary w-100" id="resetSettings">
      <i class="bi bi-arrow-counterclockwise"></i>&nbsp;Reset settings
    </button>

    <p class="text-muted small mb-0 pt-4 text-center" id="poolInfo"></p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
  'use strict';

  const LS_KEY = 'dict_trainer_v1';
  const DEFAULTS = { dir: 'en-ru', secFrom: 0, secTo: 9999 };

  // --- Состояние ---
  let DATA = null;          // весь dictionary.json
  let SUBSECTIONS = [];     // плоский список подразделов: {gIdx, themeRu, themeEn, secRu, secEn, subsection:{ru,en}, entries}
  let POOL = [];            // текущие записи в выбранном диапазоне: {entry, sub}
  let current = null;       // выбранная запись {entry, sub}
  let revealed = false;
  let settings = loadSettings();

  // --- DOM ---
  const $ = (id) => document.getElementById(id);
  const wordMain   = $('wordMain');
  const wordTran   = $('wordTran');
  const wordHidden = $('wordHidden');
  const revealBtn  = $('revealBtn');
  const nextBtn    = $('nextBtn');
  const promptLabel= $('promptLabel');
  const blockCrumbs= $('blockCrumbs');
  const blockList  = $('blockList');
  const blockPanel = $('blockPanel');
  const poolInfo   = $('poolInfo');
  const secFromSel = $('secFrom');
  const secToSel   = $('secTo');
  const topbar     = $('topbar');
  const searchBtn  = $('searchBtn');
  const searchBar  = $('searchBar');
  const searchInput= $('searchInput');
  const searchClear= $('searchClear');
  const searchResults = $('searchResults');

  // ---------- Загрузка данных ----------
  // Источник: встроенный блок <script id="dict-data"> (работает и с file://,
  // и с http/GitHub Pages). Если блок пуст — откат на fetch('./dictionary.json').
  function loadEmbedded() {
    const tag = document.getElementById('dict-data');
    if (!tag) return null;
    const txt = (tag.textContent || '').trim();
    if (!txt) return null;
    return JSON.parse(txt);
  }

  async function loadFetched() {
    const resp = await fetch('./dictionary.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('dictionary.json: HTTP ' + resp.status);
    return resp.json();
  }

  async function loadDictionary() {
    try { return loadEmbedded(); }
    catch (e) { console.warn('embedded dict parse failed, fallback to fetch:', e); }
    return await loadFetched();
  }

  function buildSubsections(themes) {
    const out = [];
    let gIdx = 0;
    themes.forEach(t => {
      (t.sections || []).forEach(s => {
        (s.subsections || []).forEach(sub => {
          out.push({
            gIdx: gIdx,
            themeRu: t.theme.ru, themeEn: t.theme.en,
            secRu: s.section.ru, secEn: s.section.en,
            subsection: sub.subsection || {},
            number: sub.number,
            entries: sub.entries || []
          });
          gIdx++;
        });
      });
    });
    return out;
  }

  // ---------- Настройки ----------
  function loadSettings() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      return Object.assign({}, DEFAULTS, raw);
    } catch { return Object.assign({}, DEFAULTS); }
  }
  function saveSettings() {
    localStorage.setItem(LS_KEY, JSON.stringify(settings));
  }

  // ---------- Заполнение select'ов подразделов ----------
  const THEME_ABBR = { 'Глаголы': 'Гл.', 'Прилагательные': 'Прил.', 'Существительные': 'Сущ.' };

  function compactLabel(s) {
    const abbr = THEME_ABBR[s.themeRu] || s.themeRu;
    const subRu = s.subsection.ru || '';
    const num = s.number ? s.number + '. ' : '';
    return `${abbr} · ${s.secRu} · ${num}${subRu}`;
  }

  function fillSectionSelects() {
    const html = SUBSECTIONS.map(s =>
      `<option value="${s.gIdx}">${compactLabel(s)}</option>`
    ).join('');
    secFromSel.innerHTML = html;
    secToSel.innerHTML = html;
  }

  // ---------- Пул записей по диапазону ----------
  function rebuildPool() {
    const from = Math.min(settings.secFrom, settings.secTo);
    const to   = Math.max(settings.secFrom, settings.secTo);
    const pool = [];
    for (let gIdx = from; gIdx <= to; gIdx++) {
      const sub = SUBSECTIONS[gIdx];
      if (!sub) continue;
      (sub.entries || []).forEach(e => {
        if (!e || !e.ru || !e.en) return;
        pool.push({ entry: e, sub });
      });
    }
    POOL = pool;
  }

  // ---------- Поиск ----------
  let SEARCH_IDX = [];   // плоский индекс: {entry, sub} по всему справочнику
  let lastResults = [];  // последний показанный топ-5
  let searchTimer = null;

  function buildSearchIndex() {
    SEARCH_IDX = [];
    SUBSECTIONS.forEach(sub => {
      (sub.entries || []).forEach(e => {
        if (!e || !e.ru || !e.en) return;
        SEARCH_IDX.push({ entry: e, sub });
      });
    });
  }

  // Оценка совпадения по одному полю. Больше = релевантнее.
  function scoreField(hay, q) {
    if (!hay) return 0;
    const h = hay.toLowerCase();
    const pos = h.indexOf(q);
    if (pos < 0) return 0;
    let s = 0;
    if (h === q) s += 1000;                       // точное совпадение
    const prev = pos === 0 ? '' : h[pos - 1];
    const boundary = pos === 0 || /[\s()«»\-.,;:]/.test(prev);
    if (pos === 0) s += 300;                      // префикс слова
    else if (boundary) s += 150;                  // начало слова внутри строки
    s += 100 - Math.min(pos, 100);                // чем раньше — тем лучше
    s += (q.length / Math.max(h.length, 1)) * 80; // близость длины
    return s;
  }

  function searchEntries(qRaw) {
    const q = qRaw.trim().toLowerCase();
    if (q.length < 2) return [];
    const scored = [];
    const seen = new Set(); // дедуп по показываемому слову внутри подраздела
    for (const r of SEARCH_IDX) {
      const sr = scoreField(r.entry.ru, q);
      const se = scoreField(r.entry.en, q);
      const best = Math.max(sr, se);
      if (best <= 0) continue;
      const field = sr >= se ? 'ru' : 'en';
      const key = `${r.sub.gIdx}|${field}|${r.entry[field]}`;
      if (seen.has(key)) continue;
      seen.add(key);
      scored.push({ r, score: best, field });
    }
    scored.sort((a, b) => b.score - a.score);
    return scored.slice(0, 5);
  }

  // Подсветка первого вхождения подстроки (уже экранированный HTML).
  function highlight(text, qRaw) {
    const s = escapeHtml(text || '');
    if (!qRaw) return s;
    const q = qRaw.trim();
    if (q.length < 1) return s;
    const pos = (text || '').toLowerCase().indexOf(q.toLowerCase());
    if (pos < 0) return s;
    const before = (text || '').slice(0, pos);
    const mid = (text || '').slice(pos, pos + q.length);
    const after = (text || '').slice(pos + q.length);
    return escapeHtml(before) + '<strong>' + escapeHtml(mid) + '</strong>' + escapeHtml(after);
  }

  function renderResults(qRaw) {
    const q = qRaw.trim();
    const results = searchEntries(q);
    if (!results.length) {
      lastResults = [];
      searchResults.innerHTML = '<li class="search-empty">Nothing found</li>';
      searchResults.classList.add('open');
      return;
    }
    lastResults = results;
    let prevGIdx = null;
    let html = '';
    results.forEach((item, i) => {
      const sub = item.r.sub;
      const entry = item.r.entry;
      // Группировка: крошки только у первого слова из одного подраздела
      const showCrumb = sub.gIdx !== prevGIdx;
      prevGIdx = sub.gIdx;
      let crumb = '';
      if (showCrumb) {
        const abbr = THEME_ABBR[sub.themeRu] || sub.themeRu;
        const sec = escapeHtml(sub.secRu || '');
        const num = sub.number ? sub.number + '. ' : '';
        const subName = sub.subsection && sub.subsection.ru
          ? `${num}${escapeHtml(sub.subsection.ru)}` : '';
        crumb = `<div class="search-crumb">${abbr}<span class="crumb-sep">›</span>${sec}${subName ? '<span class="crumb-sep">›</span>' + subName : ''}</div>`;
      }
      // Только совпавшее слово (поле, где найдена подстрока), без перевода
      const word = highlight(entry[item.field], q);
      html += `<li class="search-item" data-i="${i}" role="option">${crumb}` +
              `<div class="search-words"><span class="word">${word}</span></div></li>`;
    });
    searchResults.innerHTML = html;
    searchResults.classList.add('open');
  }

  function openSearch() {
    topbar.classList.add('search-open');
    requestAnimationFrame(() => searchInput.focus());
  }

  function closeSearch() {
    topbar.classList.remove('search-open');
    searchResults.classList.remove('open');
    searchResults.innerHTML = '';
    searchInput.value = '';
    searchInput.blur();
  }

  function selectResult(res) {
    // Слово подставляется на языке, на котором найдено: en→en-ru, ru→ru-en
    const neededDir = res.field === 'en' ? 'en-ru' : 'ru-en';
    if (settings.dir !== neededDir) {
      settings.dir = neededDir;
      saveSettings();
      applyDirectionUI();
    }
    current = { entry: res.r.entry, sub: res.r.sub };
    closeSearch();
    showCurrent();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function bindSearch() {
    searchBtn.addEventListener('click', () => {
      if (topbar.classList.contains('search-open')) closeSearch();
      else openSearch();
    });

    searchInput.addEventListener('input', () => {
      clearTimeout(searchTimer);
      const v = searchInput.value;
      if (v.trim().length < 2) {
        searchResults.classList.remove('open');
        searchResults.innerHTML = '';
        return;
      }
      searchTimer = setTimeout(() => renderResults(v), 120);
    });

    searchInput.addEventListener('keydown', (ev) => {
      if (ev.key === 'Escape') { ev.preventDefault(); closeSearch(); searchBtn.focus(); return; }
      if (ev.key === 'Enter') {
        ev.preventDefault();
        const first = searchResults.querySelector('.search-item');
        if (first) first.click();
      }
    });

    // При расфокусе — закрыть, но дать клику по результату сработать
    searchInput.addEventListener('blur', () => {
      setTimeout(() => {
        if (!searchBar.contains(document.activeElement)) closeSearch();
      }, 160);
    });

    searchClear.addEventListener('click', () => {
      searchInput.value = '';
      searchResults.classList.remove('open');
      searchResults.innerHTML = '';
      searchInput.focus();
    });

    // mousedown предотвращает потерю фокуса инпутом → клик успевает сработать
    searchResults.addEventListener('mousedown', (ev) => {
      if (ev.target.closest('.search-item')) ev.preventDefault();
    });
    searchResults.addEventListener('click', (ev) => {
      const li = ev.target.closest('.search-item');
      if (!li) return;
      const i = parseInt(li.dataset.i, 10);
      const res = lastResults[i];
      if (res && res.r) selectResult(res);
    });
  }

  // ---------- Рендер ----------
  function applyDirectionUI() {
    const dir = settings.dir;
    if (dir === 'en-ru') {
      $('tab-en-ru').classList.add('active');
      $('tab-ru-en').classList.remove('active');
    } else {
      $('tab-ru-en').classList.add('active');
      $('tab-en-ru').classList.remove('active');
    }
  }

  // Размещение блока транскрипции: EN→RU — над кнопками (после слова-вопроса),
  // RU→EN — в самом низу (после ответа), чтобы кнопки не прыгали при раскрытии.
  function placeTran(dir) {
    const btnRow = $('btnRow');
    if (dir === 'en-ru') {
      btnRow.parentNode.insertBefore(wordTran, btnRow);
    } else {
      wordHidden.parentNode.insertBefore(wordTran, wordHidden.nextSibling);
    }
  }

  function showCurrent() {
    if (!current) {
      wordMain.textContent = '—';
      wordHidden.classList.add('d-none');
      wordTran.classList.add('d-none');
      blockPanel.classList.add('d-none');
      promptLabel.textContent = '';
      poolInfo.textContent = 'No words in the selected range.';
      return;
    }
    const dir = settings.dir;
    const e = current.entry;
    const shown = (dir === 'en-ru') ? e.en : e.ru;
    const hidden = (dir === 'en-ru') ? e.ru : e.en;

    // Подпись над словом — раздел › подраздел
    const sub = current.sub;
    if (sub && sub.subsection && sub.subsection.ru) {
      const secName = `${sub.secRu}<span class="dot-sep">·</span>${sub.secEn}`;
      const subName = `${sub.subsection.ru}<span class="dot-sep">·</span>${sub.subsection.en}`;
      promptLabel.innerHTML =
        `${secName}<span class="text-secondary crumb-sep">›</span><span class="prompt-sub">${subName}</span>`;
    } else {
      promptLabel.textContent = '';
    }

    wordMain.textContent = shown || '—';
    wordHidden.textContent = hidden || '—';
    wordHidden.classList.add('d-none');
    wordTran.textContent = e.tran || '';
    // транскрипция — только когда английское слово показано как вопрос (EN→RU)
    wordTran.classList.toggle('d-none', !(dir === 'en-ru' && e.tran));
    // EN→RU: произношение вопроса над кнопками (статично);
    // RU→EN: произношение ответа под кнопками (появляется на раскрытии, не двигая кнопки)
    placeTran(dir);
    revealed = false;
    revealBtn.disabled = false;
    revealBtn.innerHTML = '<i class="bi bi-eye"></i>&nbsp;Show translation';

    // Блок раздела показывается только при раскрытии ответа
    blockPanel.classList.add('d-none');
    poolInfo.textContent = `Words in range: ${POOL.length}`;
  }

  function renderBlock() {
    if (!current) { blockPanel.classList.add('d-none'); return; }
    const sub = current.sub;
    const dir = settings.dir;

    const themeName = `${sub.themeRu}<span class="dot-sep">·</span>${sub.themeEn}`;
    const secName   = `${sub.secRu}<span class="dot-sep">·</span>${sub.secEn}`;
    const subName   = sub.subsection && sub.subsection.ru ? `${sub.subsection.ru}<span class="dot-sep">·</span>${sub.subsection.en}` : '';

    blockCrumbs.innerHTML =
      `<span class="crumb-line"><span class="crumb-item"><i class="bi bi-folder2-open"></i> ${themeName}</span>` +
      `<span class="text-secondary crumb-sep">›</span>` +
      `<span class="crumb-item">${secName}</span></span>` +
      (subName ? `<span class="crumb-line crumb-sub">${subName}</span>` : '');

    const entries = sub.entries || [];
    const curOrder = current.entry.order;
    blockList.innerHTML = entries.map(e => {
      const cls = ['w', e.is_main ? 'is-main' : '', e.order === curOrder ? 'cur' : ''].filter(Boolean).join(' ');
      const ru = escapeHtml(e.ru || '');
      const en = escapeHtml(e.en || '');
      // в блоке ru и en — двумя выровненными колонками; главное слово жирным, текущее — подсвечено
      return `<span class="${cls}"><span class="ru">${ru}</span><span class="en">${en}</span></span>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- Действия ----------
  function reveal() {
    if (!current) return;
    if (revealed) {
      // свернуть: скрыть перевод, транскрипцию ответа (RU→EN) и блок раздела
      revealed = false;
      wordHidden.classList.add('d-none');
      if (settings.dir === 'ru-en') wordTran.classList.add('d-none');
      blockPanel.classList.add('d-none');
      revealBtn.innerHTML = '<i class="bi bi-eye"></i>&nbsp;Show translation';
      return;
    }
    revealed = true;
    wordHidden.classList.remove('d-none');
    // при RU→EN показываем транскрипцию английского ответа после раскрытия
    if (settings.dir === 'ru-en' && current.entry.tran) wordTran.classList.remove('d-none');
    revealBtn.innerHTML = '<i class="bi bi-eye-slash"></i>&nbsp;Hide translation';
    renderBlock();
    blockPanel.classList.remove('d-none');
  }

  function next() {
    if (!POOL.length) { current = null; showCurrent(); return; }
    let idx;
    if (POOL.length === 1) {
      idx = 0;
    } else {
      do { idx = Math.floor(Math.random() * POOL.length); }
      while (POOL[idx] === current);
    }
    current = POOL[idx];
    showCurrent();
  }

  // ---------- Применение настроек ----------
  // Дизейблим пункты, выходящие за выбранный диапазон:
  // в "from" — значения > to, в "to" — значения < from.
  function updateRangeOptions() {
    const from = parseInt(secFromSel.value, 10) || 0;
    const to   = parseInt(secToSel.value, 10)   || 0;
    Array.from(secFromSel.options).forEach(opt => {
      opt.disabled = parseInt(opt.value, 10) > to;
    });
    Array.from(secToSel.options).forEach(opt => {
      opt.disabled = parseInt(opt.value, 10) < from;
    });
  }

  function applySettingsToUI() {
    applyDirectionUI();
    const max = SUBSECTIONS.length - 1;
    settings.secFrom = clampInt(settings.secFrom, 0, max);
    settings.secTo   = clampInt(settings.secTo,   0, max);
    secFromSel.value = String(settings.secFrom);
    secToSel.value   = String(settings.secTo);
    updateRangeOptions();
  }
  function clampInt(v, lo, hi) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = lo;
    if (v < lo) v = lo;
    if (v > hi) v = hi;
    return v;
  }

  function onDirChange(dir) {
    settings.dir = dir;
    saveSettings();
    applyDirectionUI();
    if (current) showCurrent();
  }

  function onRangeChange() {
    let from = parseInt(secFromSel.value, 10);
    let to   = parseInt(secToSel.value, 10);
    if (from > to) { // автоматически держим from <= to
      to = from;
      secToSel.value = String(to);
    }
    settings.secFrom = from;
    settings.secTo = to;
    saveSettings();
    updateRangeOptions();
    rebuildPool();
    next();
  }

  // ---------- События ----------
  function bindEvents() {
    nextBtn.addEventListener('click', next);
    revealBtn.addEventListener('click', reveal);

    $('tab-en-ru').addEventListener('click', () => onDirChange('en-ru'));
    $('tab-ru-en').addEventListener('click', () => onDirChange('ru-en'));

    secFromSel.addEventListener('change', () => {
      if (parseInt(secFromSel.value,10) > parseInt(secToSel.value,10)) {
        secToSel.value = secFromSel.value;
      }
      onRangeChange();
    });
    secToSel.addEventListener('change', () => {
      if (parseInt(secToSel.value,10) < parseInt(secFromSel.value,10)) {
        secFromSel.value = secToSel.value;
      }
      onRangeChange();
    });

    $('resetSettings').addEventListener('click', () => {
      localStorage.removeItem(LS_KEY);
      settings = Object.assign({}, DEFAULTS);
      applySettingsToUI();
      rebuildPool();
      next();
    });

    // клавиша пробел/enter — показать перевод; стрелка вправо — следующее
    document.addEventListener('keydown', (ev) => {
      if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT') return;
      if (ev.code === 'Space' || ev.code === 'Enter') {
        ev.preventDefault();
        if (!revealed) reveal(); else next();
      } else if (ev.code === 'ArrowRight') {
        next();
      }
    });
  }

  // ---------- Старт ----------
  async function init() {
    try {
      DATA = await loadDictionary();
    } catch (err) {
      wordMain.textContent = '⚠️';
      poolInfo.innerHTML = `Failed to load <code>dictionary.json</code>: ${escapeHtml(err.message)}.
        Run the file via a static server (GitHub Pages / <code>python -m http.server</code>).`;
      blockPanel.classList.add('d-none');
      return;
    }
    SUBSECTIONS = buildSubsections(DATA.themes || []);
    if (!SUBSECTIONS.length) {
      poolInfo.textContent = 'No subsections in dictionary.json.';
      blockPanel.classList.add('d-none');
      return;
    }
    fillSectionSelects();
    applySettingsToUI();
    buildSearchIndex();
    bindEvents();
    bindSearch();
    rebuildPool();
    next();
  }

  init();
})();
</script>
</body>
</html>
