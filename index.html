<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vocabulary Trainer — Minimal Dictionary</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    html, body { height: 100%; }
    body { background: #f6f7f9; }
    .word-card {
      max-width: 820px;
      width: 100%;
    }
    .word-main {
      font-size: clamp(3rem, 10vw, 5rem);
      font-weight: 700;
      line-height: 1.1;
      word-break: break-word;
    }
    .word-tran {
      font-size: 1.5rem;
      color: #6c757d;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .word-hidden {
      font-size: clamp(2.2rem, 7vw, 3.4rem);
      font-weight: 600;
      word-break: break-word;
    }
    .block-panel {
      max-width: 720px;
      width: 100%;
    }
    .block-list {
      font-size: .92rem;
      line-height: 1.5;
      column-count: 2;
      column-gap: 1.5rem;
    }
    @media (max-width: 575.98px) {
      .block-list { column-count: 1; }
    }
    .block-list .w {
      display: flex;
      align-items: baseline;
      gap: .75rem;
      break-inside: avoid;
    }
    .block-list .w .ru {
      flex: 0 0 52%;
      min-width: 0;
      overflow-wrap: anywhere;
    }
    .block-list .w .en {
      flex: 1 1 auto;
      text-align: start;
    }
    .block-list .is-main { font-weight: 700; }
    .block-list .cur {
      background: #fff3cd;
      border-radius: .25rem;
      margin-left: -.45rem;
    }
    .block-list .cur .ru {
      padding-left: .45rem;
      flex: 0 0 53%;
    }
    .breadcrumb-mini { font-size: .8rem; margin: 0; text-align: start; }
    .breadcrumb-mini .crumb-line { display: block; line-height: 1.5; }
    .breadcrumb-mini .crumb-item { display: inline-block; }
    .breadcrumb-mini .crumb-sub { font-weight: 400; font-size: .92rem; }
    .breadcrumb-mini .crumb-sep { margin: 0 .75rem; }
    .breadcrumb-mini .dot-sep { font-weight: 900; font-size: 1.15em; margin: 0 .25em; }
    .block-list { text-align: start; }
    .topbar {
      position: sticky; top: 0; z-index: 1020;
      background: #fff;
      border-bottom: 1px solid #e9ecef;
    }
    .stage {
      min-height: calc(100vh - 56px);
    }
    .arrow-sm { font-size: .8em; vertical-align: .03em; }
    #nextBtn:hover, #nextBtn:active, #nextBtn:focus, #nextBtn:focus-visible {
      background-color: transparent;
      color: var(--bs-primary, #0d6efd);
      border-color: var(--bs-primary, #0d6efd);
      box-shadow: none;
    }
    @media (max-width: 575.98px) {
      .topbar .burger-btn { right: .5rem !important; }
    }
  </style>
</head>
<body>

<!-- Верхняя панель: бургер (настройки, слева) + табы направления (по центру) -->
<header class="topbar">
  <div class="container position-relative d-flex justify-content-center align-items-center gap-3 py-2">
    <button class="btn btn-outline-secondary btn-sm d-flex align-items-center gap-1 position-absolute end-0 burger-btn" type="button"
            data-bs-toggle="offcanvas" data-bs-target="#settingsDrawer" aria-controls="settingsDrawer">
      <i class="bi bi-list fs-5"></i>
      <span class="d-none d-sm-inline">Settings</span>
    </button>

    <ul class="nav nav-pills" id="dirTabs" role="tablist">
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-en-ru" type="button" data-dir="en-ru">EN <i class="bi bi-arrow-right arrow-sm"></i> RU</button>
      </li>
      <li class="nav-item" role="presentation">
        <button class="nav-link" id="tab-ru-en" type="button" data-dir="ru-en">RU <i class="bi bi-arrow-right arrow-sm"></i> EN</button>
      </li>
    </ul>
  </div>
</header>

<main class="stage d-flex flex-column align-items-center justify-content-start px-3 pt-5 pb-4 gap-4">

  <!-- Карточка со словом -->
  <section class="word-card card shadow-sm border-0 rounded-4 text-center">
    <div class="card-body py-5 px-4 d-flex flex-column align-items-center justify-content-center gap-4">

      <div class="text-uppercase text-secondary small fw-semibold" id="promptLabel">English</div>

      <div class="word-main" id="wordMain">—</div>

      <div class="d-flex flex-wrap gap-2 justify-content-center mt-2" id="btnRow">
        <button class="btn btn-primary" id="revealBtn">
          <i class="bi bi-eye"></i>&nbsp;Show translation
        </button>
        <button class="btn btn-outline-primary" id="nextBtn">
          <i class="bi bi-shuffle"></i>&nbsp;Next word
        </button>
      </div>

      <div class="word-tran d-none" id="wordTran"></div>
      <div class="word-hidden d-none" id="wordHidden"></div>
    </div>
  </section>

  <!-- Блок: тема / раздел / подраздел + все слова блока -->
  <section class="block-panel card shadow-sm border-0 rounded-4 text-start" id="blockPanel">
    <div class="card-body p-3">
      <nav class="breadcrumb-mini text-muted" id="blockCrumbs"></nav>
      <hr class="my-2">
      <div class="block-list text-body-secondary" id="blockList"></div>
    </div>
  </section>

  <p class="text-muted small" id="poolInfo"></p>
</main>

<!-- Боковое меню настроек -->
<div class="offcanvas offcanvas-end" tabindex="-1" id="settingsDrawer" aria-labelledby="settingsLabel">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="settingsLabel">Settings</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
  </div>
  <div class="offcanvas-body">

    <div class="mb-4">
      <label class="form-label fw-semibold mb-2">Translation direction</label>
      <div class="btn-group w-100" role="group">
        <input type="radio" class="btn-check" name="dirRadio" id="dirEnRu" value="en-ru">
        <label class="btn btn-outline-primary" for="dirEnRu">EN <i class="bi bi-arrow-right arrow-sm"></i> RU</label>
        <input type="radio" class="btn-check" name="dirRadio" id="dirRuEn" value="ru-en">
        <label class="btn btn-outline-primary" for="dirRuEn">RU <i class="bi bi-arrow-right arrow-sm"></i> EN</label>
      </div>
    </div>

    <hr>

    <div class="mb-3">
      <label for="secFrom" class="form-label fw-semibold">Section from</label>
      <select class="form-select" id="secFrom"></select>
    </div>

    <div class="mb-3">
      <label for="secTo" class="form-label fw-semibold">Section to</label>
      <select class="form-select" id="secTo"></select>
      <div class="form-text">Range includes the selected sections.</div>
    </div>

    <hr>

    <button class="btn btn-outline-secondary w-100" id="resetSettings">
      <i class="bi bi-arrow-counterclockwise"></i>&nbsp;Reset settings
    </button>
  </div>
</div>

is_main":true,"tran":"[ˈrɪtʃ]"},{"order":1078,"page":116,"ru":"благосостоятельный","en":"well-to-do","is_main":false,"tran":"[ˈwelˈtuːˈduː]"},{"order":1079,"page":117,"ru":"хорошо одетый","en":"well-dressed","is_main":true,"tran":"[ˈwelˈdrest]"},{"order":1080,"page":117,"ru":"оборванный","en":"ragged","is_main":false,"tran":"[ˈræɡəd]"},{"order":1081,"page":117,"ru":"сытый","en":"full","is_main":false,"tran":"[ˈfʊl]"},{"order":1082,"page":117,"ru":"голодный","en":"hungry","is_main":false,"tran":"[ˈhʌŋɡri]"},{"order":1083,"page":117,"ru":"жаждущий","en":"thirsty","is_main":false,"tran":"[ˈθɜːsti]"}]},{"number":3,"subsection":{"ru":"Биологическое и семейное положение","en":"Biological and Family Status"},"entries":[{"order":1084,"page":117,"ru":"молодой","en":"young","is_main":true,"tran":"[ˈjʌŋ]"},{"order":1085,"page":117,"ru":"взрослый","en":"grown-up","is_main":false,"tran":"[ˈɡrəʊˌnʌp]"},{"order":1086,"page":117,"ru":"зрелый","en":"mature","is_main":false,"tran":"[məˈtʃʊə]"},{"order":1087,"page":117,"ru":"неженатый","en":"single","is_main":true,"tran":"[ˈsɪŋɡəl]"},{"order":1088,"page":117,"ru":"женатый замужем","en":"married","is_main":false,"tran":"[ˈmerid]"},{"order":1089,"page":117,"ru":"разведенный","en":"divorced","is_main":false,"tran":"[dɪˈvɔːst]"},{"order":1090,"page":117,"ru":"беременная","en":"pregnant","is_main":false,"tran":"[ˈpreɡnənt]"}]},{"number":4,"subsection":{"ru":"Применение","en":"Application"},"entries":[{"order":1091,"page":117,"ru":"удобный","en":"comfortable","is_main":true,"tran":"[ˈkʌmfətəbəl]"},{"order":1092,"page":117,"ru":"неудобный","en":"uncomfortable","is_main":false,"tran":"[əˈnkʌmfətəbəl]"},{"order":1093,"page":117,"ru":"удобный","en":"convenient","is_main":false,"tran":"[kəˈnviːnjənt]"},{"order":1094,"page":117,"ru":"неудобный","en":"inconvenient","is_main":false,"tran":"[ˌɪnkəˈnviːnjənt]"},{"order":1095,"page":117,"ru":"готовый","en":"ready","is_main":true,"tran":"[ˈredi]"},{"order":1096,"page":117,"ru":"завершенный","en":"compl s_main":true,"tran":"[ˈeə]"},{"order":1116,"page":118,"ru":"облако","en":"cloud","is_main":false,"tran":"[ˈklaʊd]"},{"order":1117,"page":118,"ru":"солнце","en":"sun","is_main":true,"tran":"[ˈsʌn]"},{"order":1118,"page":118,"ru":"звезда","en":"star","is_main":false,"tran":"[ˈstɑː]"},{"order":1119,"page":118,"ru":"луна","en":"moon","is_main":false,"tran":"[ˈmuːn]"},{"order":1120,"page":118,"ru":"планета","en":"planet","is_main":false,"tran":"[ˈplænət]"}]},{"number":2,"subsection":{"ru":"Земля","en":"Earth"},"entries":[{"order":1121,"page":118,"ru":"земля","en":"earth","is_main":true,"tran":"[ˈɜːθ]"},{"order":1122,"page":118,"ru":"почва","en":"soil","is_main":false,"tran":"[ˈsɔɪl]"},{"order":1123,"page":118,"ru":"суша","en":"land","is_main":false,"tran":"[ˈlænd]"},{"order":1124,"page":118,"ru":"континент","en":"continent","is_main":true,"tran":"[ˈkɒntənənt]"},{"order":1125,"page":118,"ru":"полуостров","en":"peninsula","is_main":false,"tran":"[pəˈnɪnsələ]"},{"order":1126,"page":118,"ru":"остров","en":"island","is_main":false,"tran":"[ˈaɪlənd]"},{"order":1127,"page":118,"ru":"берег","en":"shore","is_main":true,"tran":"[ˈʃɔː]"},{"order":1128,"page":118,"ru":"берег реки","en":"bank","is_main":false,"tran":"[ˈbæŋk]"}]}]}]}]}

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
(() => {
  'use strict';

  const LS_KEY = 'dict_trainer_v1';
  const DEFAULTS = { dir: 'en-ru', secFrom: 0, secTo: 9999 };

  // --- Состояние ---
  let DATA = null;          // весь dictionary.json
  let SECTIONS = [];        // плоский список разделов: {gIdx, themeRu, themeEn, secRu, secEn, subs:[{...}]}
  let POOL = [];            // текущие записи в выбранном диапазоне: {entry, gIdx, sub}
  let current = null;       // выбранная запись {entry, gIdx, sub}
  let revealed = false;
  let settings = loadSettings();

  // --- DOM ---
  const $ = (id) => document.getElementById(id);
  const wordMain   = $('wordMain');
  const wordTran   = $('wordTran');
  const wordHidden = $('wordHidden');
  const revealBtn  = $('revealBtn');
  const nextBtn    = $('nextBtn');
  const promptLabel= $('promptLabel');
  const blockCrumbs= $('blockCrumbs');
  const blockList  = $('blockList');
  const blockPanel = $('blockPanel');
  const poolInfo   = $('poolInfo');
  const secFromSel = $('secFrom');
  const secToSel   = $('secTo');

  // ---------- Загрузка данных ----------
  // Источник: встроенный блок <script id="dict-data"> (работает и с file://,
  // и с http/GitHub Pages). Если блок пуст — откат на fetch('./dictionary.json').
  function loadEmbedded() {
    const tag = document.getElementById('dict-data');
    if (!tag) return null;
    const txt = (tag.textContent || '').trim();
    if (!txt) return null;
    return JSON.parse(txt);
  }

  async function loadFetched() {
    const resp = await fetch('./dictionary.json', { cache: 'no-cache' });
    if (!resp.ok) throw new Error('dictionary.json: HTTP ' + resp.status);
    return resp.json();
  }

  async function loadDictionary() {
    try { return loadEmbedded(); }
    catch (e) { console.warn('embedded dict parse failed, fallback to fetch:', e); }
    return await loadFetched();
  }

  function buildSections(themes) {
    const out = [];
    let gIdx = 0;
    themes.forEach(t => {
      (t.sections || []).forEach(s => {
        out.push({
          gIdx: gIdx,
          themeRu: t.theme.ru, themeEn: t.theme.en,
          secRu: s.section.ru, secEn: s.section.en,
          subs: s.subsections || []
        });
        gIdx++;
      });
    });
    return out;
  }

  // ---------- Настройки ----------
  function loadSettings() {
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
      return Object.assign({}, DEFAULTS, raw);
    } catch { return Object.assign({}, DEFAULTS); }
  }
  function saveSettings() {
    localStorage.setItem(LS_KEY, JSON.stringify(settings));
  }

  // ---------- Заполнение select'ов разделов ----------
  const THEME_ABBR = { 'Глаголы': 'Гл.', 'Прилагательные': 'Прил.', 'Существительные': 'Сущ.' };

  function compactLabel(s) {
    const abbr = THEME_ABBR[s.themeRu] || s.themeRu;
    return `${abbr} · ${s.secRu}`;
  }

  function fillSectionSelects() {
    const html = SECTIONS.map(s =>
      `<option value="${s.gIdx}">${compactLabel(s)}</option>`
    ).join('');
    secFromSel.innerHTML = html;
    secToSel.innerHTML = html;
  }

  // ---------- Пул записей по диапазону ----------
  function rebuildPool() {
    const from = Math.min(settings.secFrom, settings.secTo);
    const to   = Math.max(settings.secFrom, settings.secTo);
    const pool = [];
    for (let gIdx = from; gIdx <= to; gIdx++) {
      const sec = SECTIONS[gIdx];
      if (!sec) continue;
      sec.subs.forEach(sub => {
        (sub.entries || []).forEach(e => {
          // пропускаем пустые
          if (!e || !e.ru || !e.en) return;
          pool.push({ entry: e, gIdx, sub });
        });
      });
    }
    POOL = pool;
  }

  // ---------- Рендер ----------
  function applyDirectionUI() {
    const dir = settings.dir;
    if (dir === 'en-ru') {
      promptLabel.textContent = 'English';
      $('tab-en-ru').classList.add('active');
      $('tab-ru-en').classList.remove('active');
      $('dirEnRu').checked = true;
    } else {
      promptLabel.textContent = 'Russian';
      $('tab-ru-en').classList.add('active');
      $('tab-en-ru').classList.remove('active');
      $('dirRuEn').checked = true;
    }
  }

  // Размещение блока транскрипции: EN→RU — над кнопками (после слова-вопроса),
  // RU→EN — в самом низу (после ответа), чтобы кнопки не прыгали при раскрытии.
  function placeTran(dir) {
    const btnRow = $('btnRow');
    if (dir === 'en-ru') {
      btnRow.parentNode.insertBefore(wordTran, btnRow);
    } else {
      wordHidden.parentNode.insertBefore(wordTran, wordHidden.nextSibling);
    }
  }

  function showCurrent() {
    if (!current) {
      wordMain.textContent = '—';
      wordHidden.classList.add('d-none');
      wordTran.classList.add('d-none');
      blockPanel.classList.add('d-none');
      poolInfo.textContent = 'No words in the selected range.';
      return;
    }
    const dir = settings.dir;
    const e = current.entry;
    const shown = (dir === 'en-ru') ? e.en : e.ru;
    const hidden = (dir === 'en-ru') ? e.ru : e.en;

    wordMain.textContent = shown || '—';
    wordHidden.textContent = hidden || '—';
    wordHidden.classList.add('d-none');
    wordTran.textContent = e.tran || '';
    // транскрипция — только когда английское слово показано как вопрос (EN→RU)
    wordTran.classList.toggle('d-none', !(dir === 'en-ru' && e.tran));
    // EN→RU: произношение вопроса над кнопками (статично);
    // RU→EN: произношение ответа под кнопками (появляется на раскрытии, не двигая кнопки)
    placeTran(dir);
    revealed = false;
    revealBtn.disabled = false;
    revealBtn.innerHTML = '<i class="bi bi-eye"></i>&nbsp;Show translation';

    // Блок раздела показывается только при раскрытии ответа
    blockPanel.classList.add('d-none');
    poolInfo.textContent = `Words in range: ${POOL.length}`;
  }

  function renderBlock() {
    if (!current) { blockPanel.classList.add('d-none'); return; }
    const sec = SECTIONS[current.gIdx];
    const sub = current.sub;
    const dir = settings.dir;

    const themeName = `${sec.themeRu}<span class="dot-sep">·</span>${sec.themeEn}`;
    const secName   = `${sec.secRu}<span class="dot-sep">·</span>${sec.secEn}`;
    const subName   = sub.subsection ? `${sub.subsection.ru}<span class="dot-sep">·</span>${sub.subsection.en}` : '';

    blockCrumbs.innerHTML =
      `<span class="crumb-line"><span class="crumb-item"><i class="bi bi-folder2-open"></i> ${themeName}</span>` +
      `<span class="text-secondary crumb-sep">›</span>` +
      `<span class="crumb-item">${secName}</span></span>` +
      (subName ? `<span class="crumb-line crumb-sub">${subName}</span>` : '');

    const entries = sub.entries || [];
    const curOrder = current.entry.order;
    blockList.innerHTML = entries.map(e => {
      const cls = ['w', e.is_main ? 'is-main' : '', e.order === curOrder ? 'cur' : ''].filter(Boolean).join(' ');
      const ru = escapeHtml(e.ru || '');
      const en = escapeHtml(e.en || '');
      // в блоке ru и en — двумя выровненными колонками; главное слово жирным, текущее — подсвечено
      return `<span class="${cls}"><span class="ru">${ru}</span><span class="en">${en}</span></span>`;
    }).join('');
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  // ---------- Действия ----------
  function reveal() {
    if (!current) return;
    if (revealed) {
      // свернуть: скрыть перевод, транскрипцию ответа (RU→EN) и блок раздела
      revealed = false;
      wordHidden.classList.add('d-none');
      if (settings.dir === 'ru-en') wordTran.classList.add('d-none');
      blockPanel.classList.add('d-none');
      revealBtn.innerHTML = '<i class="bi bi-eye"></i>&nbsp;Show translation';
      return;
    }
    revealed = true;
    wordHidden.classList.remove('d-none');
    // при RU→EN показываем транскрипцию английского ответа после раскрытия
    if (settings.dir === 'ru-en' && current.entry.tran) wordTran.classList.remove('d-none');
    revealBtn.innerHTML = '<i class="bi bi-eye-slash"></i>&nbsp;Hide translation';
    renderBlock();
    blockPanel.classList.remove('d-none');
  }

  function next() {
    if (!POOL.length) { current = null; showCurrent(); return; }
    let idx;
    if (POOL.length === 1) {
      idx = 0;
    } else {
      do { idx = Math.floor(Math.random() * POOL.length); }
      while (POOL[idx] === current);
    }
    current = POOL[idx];
    showCurrent();
  }

  // ---------- Применение настроек ----------
  // Дизейблим пункты, выходящие за выбранный диапазон:
  // в "from" — значения > to, в "to" — значения < from.
  function updateRangeOptions() {
    const from = parseInt(secFromSel.value, 10) || 0;
    const to   = parseInt(secToSel.value, 10)   || 0;
    Array.from(secFromSel.options).forEach(opt => {
      opt.disabled = parseInt(opt.value, 10) > to;
    });
    Array.from(secToSel.options).forEach(opt => {
      opt.disabled = parseInt(opt.value, 10) < from;
    });
  }

  function applySettingsToUI() {
    applyDirectionUI();
    const max = SECTIONS.length - 1;
    settings.secFrom = clampInt(settings.secFrom, 0, max);
    settings.secTo   = clampInt(settings.secTo,   0, max);
    secFromSel.value = String(settings.secFrom);
    secToSel.value   = String(settings.secTo);
    updateRangeOptions();
  }
  function clampInt(v, lo, hi) {
    v = parseInt(v, 10);
    if (isNaN(v)) v = lo;
    if (v < lo) v = lo;
    if (v > hi) v = hi;
    return v;
  }

  function onDirChange(dir) {
    settings.dir = dir;
    saveSettings();
    applyDirectionUI();
    if (current) showCurrent();
  }

  function onRangeChange() {
    let from = parseInt(secFromSel.value, 10);
    let to   = parseInt(secToSel.value, 10);
    if (from > to) { // автоматически держим from <= to
      to = from;
      secToSel.value = String(to);
    }
    settings.secFrom = from;
    settings.secTo = to;
    saveSettings();
    updateRangeOptions();
    rebuildPool();
    next();
  }

  // ---------- События ----------
  function bindEvents() {
    nextBtn.addEventListener('click', next);
    revealBtn.addEventListener('click', reveal);

    $('tab-en-ru').addEventListener('click', () => onDirChange('en-ru'));
    $('tab-ru-en').addEventListener('click', () => onDirChange('ru-en'));
    $('dirEnRu').addEventListener('change', () => onDirChange('en-ru'));
    $('dirRuEn').addEventListener('change', () => onDirChange('ru-en'));

    secFromSel.addEventListener('change', () => {
      if (parseInt(secFromSel.value,10) > parseInt(secToSel.value,10)) {
        secToSel.value = secFromSel.value;
      }
      onRangeChange();
    });
    secToSel.addEventListener('change', () => {
      if (parseInt(secToSel.value,10) < parseInt(secFromSel.value,10)) {
        secFromSel.value = secToSel.value;
      }
      onRangeChange();
    });

    $('resetSettings').addEventListener('click', () => {
      localStorage.removeItem(LS_KEY);
      settings = Object.assign({}, DEFAULTS);
      applySettingsToUI();
      rebuildPool();
      next();
    });

    // клавиша пробел/enter — показать перевод; стрелка вправо — следующее
    document.addEventListener('keydown', (ev) => {
      if (ev.target.tagName === 'SELECT' || ev.target.tagName === 'INPUT') return;
      if (ev.code === 'Space' || ev.code === 'Enter') {
        ev.preventDefault();
        if (!revealed) reveal(); else next();
      } else if (ev.code === 'ArrowRight') {
        next();
      }
    });
  }

  // ---------- Старт ----------
  async function init() {
    try {
      DATA = await loadDictionary();
    } catch (err) {
      wordMain.textContent = '⚠️';
      poolInfo.innerHTML = `Failed to load <code>dictionary.json</code>: ${escapeHtml(err.message)}.
        Run the file via a static server (GitHub Pages / <code>python -m http.server</code>).`;
      blockPanel.classList.add('d-none');
      return;
    }
    SECTIONS = buildSections(DATA.themes || []);
    if (!SECTIONS.length) {
      poolInfo.textContent = 'No sections in dictionary.json.';
      blockPanel.classList.add('d-none');
      return;
    }
    fillSectionSelects();
    applySettingsToUI();
    bindEvents();
    rebuildPool();
    next();
  }

  init();
})();
</script>
</body>
</html>
